<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0">
<title>Frostman</title>
<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
}
  body {
    backgroung: #080b18;
    color: white;
    font-family: Arial, sans-serif;
}
  header {
    padding: 25px 8%;
    display: flex;
    justify-content: space-between;
}
.logo {
  color: #00d9ff;
  fontsize: 28px;
  font-weight:bold;
}
  nav a {
    color: white;
    text-decoration: none;
    margin-left:20px;
  }
  .hero {
    min-height: 75vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    animation: appear 1.5s ease;
  }
  h1 {
    font-size: clamp(40px, 8vw, 75px)
    margin-bottom: 20px;
  }
  h1 span {
    color: #00d9ff;
  }
  .hero p {
    color: #b9c2d8;
    font-size: 18px;
    line-height: 1.7;
  }
  .btn {
    margin-top: 30px;
    padding: 15px 35px;
    background: #00d9ff;
    color: #080b18;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
  }
  .cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 30px
  }
  .card {
    background: #131a30;
    border: 1px solid #263553;
    padding: 30px
    border-radius: 15px;
    width: 250px;
    text-align: center;
    transition: .3s;
  }
  .card:hover {
    transform: translateY(-10PX);
    border-color: #00d9ff;
  }
  .card p {
    color: #3b9c2d;
  }
  footer {
    text-align: center;
    padding: 25px;
    color: #8993aa;
  }
  @keyframes apear {
    from {opacity: 0; transform:
      translateY(30PX);}
    to {opacity: 1; transform:
      translateY(0);}
  }
  </stle>
  </head>
  <body>
  <header>
  <div class="logo">FROSTMAN.</div>
  <nav>
  <a href="#home">HOME</a>
  <a href="#about">ABOUT</a>
  </nav>
  </header>
  <section class="hero" id="home">
  <h1>Welcome to <span>Frostman</span></h1>
  <p>Welcome to my digital world.Explore creativity,technology and something extraordinary.</p>
  <a href="#about"
  class="btn">Explore More</a>
  </section>
  <section class="cards" id="about">
  <div class="card">
  <h2>Creativity</h2>
  <p>Turning amazing ideas into reality.</p>
  </div>
  <div class="card">
  <h2>Technology</h2>
  <p>Building something different and special.</p>
  </div>
  </section>
  <footer>© 2026 Frostman. All rights reserved.</footer>
  </body>
  </html>
